<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="GloGraph: a living map of how your system connects">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#242424"/>
    </pattern>
    <marker id="og-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#c83030"/>
    </marker>
    <marker id="og-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#3fb950"/>
    </marker>
    <style>
      .ui  { font-family: 'Segoe UI', Tahoma, sans-serif; }
      .mono{ font-family: Consolas, 'Cascadia Code', monospace; }
    </style>
  </defs>

  <!-- Background + bevel frame -->
  <rect width="1200" height="630" fill="#171717"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect x="16" y="16" width="1168" height="598" fill="none" stroke="#6a6a6a" stroke-width="1"/>
  <rect x="17" y="17" width="1166" height="596" fill="none" stroke="#0c0c0c" stroke-width="1"/>

  <!-- Brand lockup: the new "G" mark tile (matches the app icon / favicon) + wordmark -->
  <g transform="translate(72,66) scale(0.0625)">
    <rect width="1024" height="1024" fill="#171717"/>
    <rect x="40" y="40" width="944" height="944" rx="2" fill="#212121"/>
    <polyline points="40,984 40,40 984,40" fill="none" stroke="#6a6a6a" stroke-width="12"/>
    <polyline points="984,40 984,984 40,984" fill="none" stroke="#0c0c0c" stroke-width="12"/>
    <rect x="40" y="40" width="944" height="944" rx="2" fill="none" stroke="#1c1c1c" stroke-width="3"/>
    <g transform="translate(512 512) rotate(-45) scale(6.0) translate(-50 -50)">
      <rect x="0" y="0" width="24" height="100" fill="#ffb000"/>
      <rect x="0" y="0" width="100" height="24" fill="#ffb000"/>
      <rect x="0" y="76" width="100" height="24" fill="#ffb000"/>
      <rect x="76" y="52" width="24" height="48" fill="#ffb000"/>
      <rect x="52" y="52" width="48" height="24" fill="#ffb000"/>
    </g>
  </g>
  <text x="156" y="120" class="ui" font-size="40" font-weight="700" letter-spacing="6" fill="#cccccc">GLOGRAPH</text>

  <!-- Kicker -->
  <text x="80" y="220" class="mono" font-size="20" letter-spacing="4" fill="#ffb000">FOR SOFTWARE ARCHITECTS · LOCAL-FIRST · SCRIPTABLE</text>

  <!-- Headline -->
  <text x="78" y="296" class="ui" font-size="64" font-weight="700" fill="#cccccc">A diagram forgets.</text>
  <text x="78" y="372" class="ui" font-size="64" font-weight="700" fill="#ffb000">GloGraph remembers.</text>

  <!-- Sub -->
  <text x="80" y="436" class="ui" font-size="26" fill="#888888">A typed, queryable map of how your system connects. </text>
  <text x="80" y="472" class="ui" font-size="26" fill="#888888">Trace what breaks, script it, and own the file.</text>

  <!-- Mini graph illustration (mirrors the app: colored, labeled edges) -->
  <g transform="translate(760,150)">
    <!-- edges -->
    <path d="M150,40 C220,40 220,150 280,150" fill="none" stroke="#c83030" stroke-width="3" marker-end="url(#og-red)"/>
    <path d="M150,260 C220,260 220,160 280,160" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#og-green)"/>
    <text x="204" y="92"  class="ui" font-size="13" fill="#888888">Depends on</text>
    <text x="202" y="214" class="ui" font-size="13" fill="#888888">Depends on</text>

    <!-- node A (service) -->
    <g transform="translate(0,16)">
      <rect width="150" height="48" fill="#2a2a2a" stroke="#585858"/>
      <rect width="4" height="48" fill="#388bfd"/>
      <text x="16" y="29" class="ui" font-size="15" font-weight="600" fill="#cccccc">Billing API</text>
    </g>
    <!-- node B (service) -->
    <g transform="translate(280,126)">
      <rect width="140" height="48" fill="#2a2a2a" stroke="#585858"/>
      <rect width="4" height="48" fill="#388bfd"/>
      <text x="16" y="29" class="ui" font-size="15" font-weight="600" fill="#cccccc">Auth Service</text>
    </g>
    <!-- node C (service) -->
    <g transform="translate(0,236)">
      <rect width="150" height="48" fill="#2a2a2a" stroke="#585858"/>
      <rect width="4" height="48" fill="#388bfd"/>
      <text x="16" y="29" class="ui" font-size="15" font-weight="600" fill="#cccccc">Web App</text>
    </g>
  </g>

  <!-- CTA tag -->
  <g transform="translate(80,520)">
    <rect width="180" height="44" fill="#ffb000"/>
    <text x="90" y="29" text-anchor="middle" class="ui" font-size="18" font-weight="700" fill="#1a1200">Join the list</text>
  </g>
  <text x="276" y="549" class="ui" font-size="18" fill="#7a7a7a">Local-first · Windows · macOS · Linux</text>
</svg>
